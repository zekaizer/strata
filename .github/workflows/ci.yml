name: CI

on:
  push:
  pull_request:

# A newer push to the same branch supersedes a running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  integration:
    name: Integration tests (VS Code ${{ matrix.vscode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode: stable
            script: test:integration
          - vscode: 1.90.0
            script: test:integration:min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Xvfb
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb
      - name: Cache VS Code downloads
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ matrix.vscode }}-${{ hashFiles('.vscode-test.mjs') }}
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  package:
    name: Package VSIX
    needs: [check, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Name the VSIX after version and commit
        id: name
        run: |
          version=$(node -p "require('./package.json').version")
          file="strata-${version}-${GITHUB_SHA::7}.vsix"
          mv artifacts/strata.vsix "artifacts/${file}"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: artifacts/${{ steps.name.outputs.file }}
          retention-days: 30
          if-no-files-found: error
